name: Deploy Worker

# Validates the Cloudflare Worker backend (worker/) on every push to main that
# touches worker files, and deploys it ONCE the Worker is fully configured.
# ALL config comes from GitHub (nothing real is committed):
#   Repository *Variables*: APP_URL, ALLOWED_ORIGIN, FROM_EMAIL, ADMIN_EMAILS
#                           (KV_NAMESPACE_ID is created + written back here — no
#                            manual/local step; pin it to skip auto-resolution)
#   Repository *Secrets*:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#                           SENDGRID_API_KEY, GH_VARIABLES_TOKEN (PAT with
#                           Variables: read & write — persists the KV id)
# Until those are set it validates the code and skips the deploy with a notice
# instead of failing the build. The GitHub Pages site is handled by pipeline.yml.

on:
  push:
    branches: ['main']
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

# Pin wrangler so CI never silently jumps to a new major (e.g. v4).
env:
  WRANGLER_VERSION: '3.114.17'

jobs:
  deploy-worker:
    name: Test & Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Pure-logic unit tests (no deps, no account needed).
      - name: Worker unit tests
        run: node --test worker/test/*.test.mjs

      # Bundle the Worker without uploading — catches code/config errors on
      # every push, needs no Cloudflare account or secrets.
      - name: Validate Worker bundle (dry-run)
        working-directory: worker
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy --dry-run

      # Decide whether a real deploy can run. Missing config is a skip, not a
      # failure — so pushing Worker code never breaks CI before it's configured.
      # The KV namespace id is NOT required here — it is resolved (or created)
      # automatically in the next step; only the Cloudflare credentials + SendGrid
      # key gate the deploy.
      - name: Check deploy readiness
        id: ready
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENDGRID: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          ready=true
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::warning::Skipping deploy — set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            ready=false
          fi
          if [ -z "$SENDGRID" ]; then
            echo "::warning::Skipping deploy — set the SENDGRID_API_KEY repository secret (magic-link email)."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      # Resolve the KV namespace id with NO local/manual step. If the
      # KV_NAMESPACE_ID variable is pinned, use it; otherwise list-or-create the
      # namespace (the CF API token already carries Workers KV Storage: Edit) and
      # write the id back to the repository Variable so later runs read it
      # directly. The list-or-create guard means a failed write-back never spawns
      # duplicate namespaces. Resolved id is exported via $GITHUB_ENV.
      - name: Resolve KV namespace id
        if: steps.ready.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_ID_VAR: ${{ vars.KV_NAMESPACE_ID }}
          GH_VARIABLES_TOKEN: ${{ secrets.GH_VARIABLES_TOKEN }}
        run: |
          # An account id pasted into a GitHub secret often carries a stray
          # newline/space, which makes the API path unroutable (Cloudflare 7003).
          # Strip whitespace (the hex id has none) and re-mask the clean value.
          CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          export CLOUDFLARE_ACCOUNT_ID
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

          KV_ID="$KV_ID_VAR"
          if [ -n "$KV_ID" ]; then
            echo "Using pinned KV_NAMESPACE_ID variable."
          else
            WNAME=$(grep -E '^name *=' worker/wrangler.toml | sed -E 's/.*"(.*)".*/\1/')
            TITLE="${WNAME}-KV"   # wrangler titles a namespace <worker-name>-<binding>
            echo "Looking up KV namespace titled '$TITLE'…"
            # Capture the list separately so an API failure is NOT mistaken for
            # "no namespace found" (which would wrongly trigger a create).
            if ! LIST_JSON=$(npx --yes wrangler@"$WRANGLER_VERSION" kv namespace list); then
              echo "::error::Cloudflare KV API call failed (error 7003 = bad account path). Almost always a wrong/mistyped CLOUDFLARE_ACCOUNT_ID secret, or an API token from a different account / lacking 'Workers KV Storage: Edit'. Verify the id (dashboard → Workers & Pages → Account ID, or 'npx wrangler whoami') and the token's account + permissions."
              exit 1
            fi
            KV_ID=$(printf '%s' "$LIST_JSON" | jq -r --arg t "$TITLE" '[.[] | select(.title==$t)][0].id // empty')
            if [ -z "$KV_ID" ]; then
              echo "None found — creating it."
              if ! OUT=$(cd worker && npx --yes wrangler@"$WRANGLER_VERSION" kv namespace create KV); then
                echo "::error::Creating the KV namespace failed — same likely cause as above (CLOUDFLARE_ACCOUNT_ID / token account & permissions)."
                exit 1
              fi
              KV_ID=$(printf '%s' "$OUT" | grep -oiE '[0-9a-f]{32}' | head -n1)
              echo "Created KV namespace $KV_ID"
            else
              echo "Reusing existing KV namespace $KV_ID"
            fi
            if [ -n "$KV_ID" ] && [ -n "$GH_VARIABLES_TOKEN" ]; then
              if GH_TOKEN="$GH_VARIABLES_TOKEN" gh variable set KV_NAMESPACE_ID \
                   --repo "$GITHUB_REPOSITORY" --body "$KV_ID"; then
                echo "Persisted KV_NAMESPACE_ID repository variable."
              else
                echo "::warning::Could not write KV_NAMESPACE_ID (GH_VARIABLES_TOKEN needs Variables: read & write)."
              fi
            elif [ -z "$GH_VARIABLES_TOKEN" ]; then
              echo "::warning::GH_VARIABLES_TOKEN unset — id not persisted; list-or-create will reuse it next run."
            fi
          fi
          if [ -z "$KV_ID" ]; then
            echo "::error::Could not resolve or create the KV namespace."
            exit 1
          fi
          echo "KV_ID=$KV_ID" >> "$GITHUB_ENV"

      # Inject the resolved KV namespace id — the committed wrangler.toml only
      # carries a placeholder, so the real id is never in git. Verify it took.
      - name: Inject KV namespace id
        if: steps.ready.outputs.ready == 'true'
        run: |
          sed -i "s|REPLACE_WITH_KV_NAMESPACE_ID|${KV_ID}|" worker/wrangler.toml
          grep -q "$KV_ID" worker/wrangler.toml || {
            echo "::error::KV namespace id injection failed."
            exit 1
          }

      # Deploy, then set the runtime secret. Order matters: `secret put` targets
      # an EXISTING Worker, so the deploy (create/update) must run first. Vars
      # come from repo Variables via --var; the SendGrid key from a repo Secret
      # piped via stdin (never written to disk).
      - name: Deploy Worker + set secret
        if: steps.ready.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          npx --yes wrangler@"$WRANGLER_VERSION" deploy \
            --var APP_URL:"$APP_URL" \
            --var ALLOWED_ORIGIN:"$ALLOWED_ORIGIN" \
            --var FROM_EMAIL:"$FROM_EMAIL" \
            --var ADMIN_EMAILS:"$ADMIN_EMAILS"
          printf '%s' "$SENDGRID_API_KEY" | npx --yes wrangler@"$WRANGLER_VERSION" secret put SENDGRID_API_KEY
          # Optional: Turnstile bot-protection on the magic-link endpoint. Only
          # set when provided; absent → the Worker skips verification gracefully.
          if [ -n "$TURNSTILE_SECRET" ]; then
            printf '%s' "$TURNSTILE_SECRET" | npx --yes wrangler@"$WRANGLER_VERSION" secret put TURNSTILE_SECRET
          else
            echo "::notice::TURNSTILE_SECRET not set — magic-link Turnstile verification disabled (IP + global + per-email limits still apply)."
          fi
