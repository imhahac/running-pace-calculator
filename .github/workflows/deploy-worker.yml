name: Deploy Worker

# Validates the Cloudflare Worker backend (worker/) on every push to main that
# touches worker files, and deploys it ONCE the Worker is fully configured
# (real KV id in wrangler.toml + CLOUDFLARE_API_TOKEN/ACCOUNT_ID secrets).
# Until then it validates the code and skips the deploy with a notice instead
# of failing the build. The GitHub Pages site is handled by pipeline.yml.

on:
  push:
    branches: ['main']
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

# Pin wrangler so CI never silently jumps to a new major (e.g. v4).
env:
  WRANGLER_VERSION: '3.114.17'

jobs:
  deploy-worker:
    name: Test & Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Pure-logic unit tests (no deps, no account needed).
      - name: Worker unit tests
        run: node --test worker/test/*.test.mjs

      # Bundle the Worker without uploading — catches code/config errors on
      # every push, needs no Cloudflare account or secrets.
      - name: Validate Worker bundle (dry-run)
        working-directory: worker
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy --dry-run

      # Decide whether a real deploy can run. Missing setup is a skip, not a
      # failure — so pushing Worker code never breaks CI before it's configured.
      - name: Check deploy readiness
        id: ready
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ready=true
          if grep -q 'REPLACE_WITH_KV_NAMESPACE_ID' worker/wrangler.toml; then
            echo "::warning::Skipping deploy — worker/wrangler.toml still has the placeholder KV id. Run 'cd worker && npx wrangler kv namespace create KV' and paste the returned id into wrangler.toml."
            ready=false
          fi
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::warning::Skipping deploy — set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable automatic deploys."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        if: steps.ready.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          # Worker secrets (SENDGRID_API_KEY) persist on the Worker across deploys,
          # so set them ONCE (dashboard or `wrangler secret put`). To let CI manage
          # it instead, uncomment below and add SENDGRID_API_KEY to repo secrets:
          # secrets: |
          #   SENDGRID_API_KEY
        # env:
        #   SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
