name = "running-pace-backend"
main = "src/index.js"
compatibility_date = "2024-11-01"

# KV namespace for tokens / sessions / races / user data.
# No manual step needed: the deploy workflow auto-resolves the namespace
# (list-or-create) and writes its id back to the KV_NAMESPACE_ID repository
# *variable*, then rewrites the placeholder below at deploy time — so the real id
# is never committed. The id below is a PLACEHOLDER kept for local `wrangler dev`
# (local mode does not need a real id).
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# These are LOCAL-DEV DEFAULTS only. In production the deploy workflow overrides
# every one of them with `--var KEY:VALUE` sourced from GitHub repository
# *Variables* (APP_URL / ALLOWED_ORIGIN / FROM_EMAIL / ADMIN_EMAILS), so real
# values are not committed here.
[vars]
# Public app origin the magic link points back to (no trailing slash needed).
APP_URL = "https://imhahac.github.io/running-pace-calculator/"
# CORS: restrict to the app origin in production (or "*" while testing).
ALLOWED_ORIGIN = "https://imhahac.github.io"
# Sender address: an address on your SendGrid authenticated domain (recommended)
# or a verified Single Sender.
FROM_EMAIL = "login@example.com"
# Comma-separated admin emails allowed to PUT /api/races (no spaces).
ADMIN_EMAILS = ""

# Daily best-effort race refresh (see scheduled() in src/index.js).
[triggers]
crons = ["0 18 * * *"]

# Secret (do NOT put here): set with
#   npx wrangler secret put SENDGRID_API_KEY
